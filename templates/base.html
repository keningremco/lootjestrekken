<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lootjes trekken</title>
  <style>
    :root {
      --bg: #f2f6f3; --ink: #17261f; --muted: #5a6b62; --card: #ffffff;
      --line: #d3ded8; --accent: #1f4d3f; --on-accent: #ffffff; --red: #b4233c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1915; --ink: #e8f0ec; --muted: #97a9a0; --card: #17251f;
        --line: #2a3c34; --accent: #7fcfb2; --on-accent: #0c1511; --red: #f0788c;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 .5rem; }
    h2 { font-size: 1.15rem; margin: 0 0 .75rem; }
    a { color: var(--accent); }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
              padding: 1.25rem; margin-top: 1.25rem; }
    input, textarea, select { width: 100%; font: inherit; color: inherit; background: var(--bg);
              border: 1px solid var(--line); border-radius: 8px; padding: .6rem .75rem; }
    textarea { resize: vertical; }
    input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible
      { outline: 3px solid var(--accent); outline-offset: 2px; }
    button { font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 8px;
             padding: .6rem 1.1rem; background: var(--accent); color: var(--on-accent); }
    button.quiet { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
    button.danger { background: transparent; color: var(--red); border: 1px solid var(--red); font-weight: 500; }
    form + form { margin-top: .75rem; }
    .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
    .row input, .row select { flex: 1 1 180px; width: auto; }
    .between { justify-content: space-between; }
    .muted { color: var(--muted); }
    .small { font-size: .9rem; color: var(--muted); }
    .code { font-size: 2rem; letter-spacing: .4em; text-align: center; margin-bottom: .75rem; }
    .big { font-size: 2.25rem; font-weight: 700; margin: .25rem 0 1rem; line-height: 1.1; }
    blockquote { margin: 0; padding: .75rem 1rem; border-left: 4px solid var(--accent);
                 background: var(--bg); white-space: pre-wrap; border-radius: 0 8px 8px 0; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
    th, td { text-align: left; padding: .5rem .25rem; border-bottom: 1px solid var(--line); font-size: .95rem; }
    td.num { font-variant-numeric: tabular-nums; letter-spacing: .08em; }
    .tag { font-size: .85rem; color: var(--muted); }
    .flash { padding: .7rem 1rem; border-radius: 8px; margin-top: 1rem; border: 1px solid var(--line); background: var(--card); }
    .flash.error { border-color: var(--red); color: var(--red); }
    nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    nav form { margin: 0; }
  </style>
</head>
<body>
<main>
  {% if session.get('user_id') or session.get('admin') %}
  <nav>
    <strong>Lootjes trekken</strong>
    <form method="post" action="{{ url_for('logout') }}"><button class="quiet">Uitloggen</button></form>
  </nav>
  {% endif %}
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}" role="status">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
